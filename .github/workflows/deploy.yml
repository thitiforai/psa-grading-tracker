name: Sync and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # 08:00 Asia/Bangkok

# Only one run at a time, so two runs cannot spend the PSA quota together.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The only step that can read the secrets.
      - name: Fetch PSA data
        run: node scripts/sync.mjs
        env:
          PSA_API_TOKEN: ${{ secrets.PSA_API_TOKEN }}
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
          PSA_ORDER_NUMBERS: ${{ secrets.PSA_ORDER_NUMBERS }}
          PSA_SUBMISSION_NUMBERS: ${{ secrets.PSA_SUBMISSION_NUMBERS }}
          PREVIOUS_DATA_URL: ${{ steps.pages.outputs.base_url }}/data/portfolio.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
